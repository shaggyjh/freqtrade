name: Paper-only strategy comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project/**'
      - '.github/workflows/paper-backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download historical candles
        run: |
          set -euo pipefail
          mkdir -p project/results
          chmod 777 project/results
          docker run --rm -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable \
            download-data --config project/config.paper.json --timeframes 1h 6h 1d --days 365
      - name: Compare strategy, timeframe and fee assumptions
        run: |
          set -euo pipefail
          run_test() {
            name="$1"; strategy="$2"; timeframe="$3"; fee="$4"
            mkdir -p "project/results/$name"
            chmod 777 "project/results/$name"
            echo "=== $name: $strategy $timeframe fee=$fee per side ==="
            docker run --rm -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable \
              backtesting --config project/config.paper.json \
              --strategy-path project/strategies --strategy "$strategy" \
              --timeframe "$timeframe" --fee "$fee" \
              --export trades --backtest-directory "project/results/$name" \
              2>&1 | tee "project/results/$name/backtest.log"
          }
          run_test ema_1h_original_fee SimpleTrend 1h 0.012
          run_test ema_1h_lower_fee SimpleTrend 1h 0.006
          run_test ema_6h_original_fee SimpleTrend 6h 0.012
          run_test ema_6h_lower_fee SimpleTrend 6h 0.006
          run_test ema_1d_original_fee SimpleTrend 1d 0.012
          run_test donchian_6h_original_fee DonchianBreakout 6h 0.012
          run_test failed_breakout_6h_original_fee FailedBreakout 6h 0.012
          run_test volatility_filtered_6h VolatilityFilteredTrend 6h 0.012
          run_test crowd_exhaustion_6h CrowdExhaustion 6h 0.012
          run_test attention_aftershock_6h AttentionAftershock 6h 0.012
      - name: Evaluate two candidates and buy-and-hold on identical historical windows
        run: |
          set -euo pipefail
          # Non-overlapping 90-day windows; earlier candles provide warmup.
          # Do not change strategy parameters based on evaluation results.
          for offset in 270 180 90; do
            start="$(date -u -d "$offset days ago" +%Y%m%d)"
            end="$(date -u -d "$((offset - 90)) days ago" +%Y%m%d)"
            for strategy in SimpleTrend VolatilityFilteredTrend; do
              name="${strategy}_6h_window_${offset}"
              mkdir -p "project/results/$name"
              chmod 777 "project/results/$name"
              echo "=== $name: $start-$end ==="
              docker run --rm -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable \
                backtesting --config project/config.paper.json \
                --strategy-path project/strategies --strategy "$strategy" \
                --timeframe 6h --fee 0.012 --timerange "$start-$end" \
                --export trades --backtest-directory "project/results/$name" \
                2>&1 | tee "project/results/$name/backtest.log"
            done
            mkdir -p "project/results/benchmark_window_${offset}"
            chmod 777 "project/results/benchmark_window_${offset}"
            docker run --rm --entrypoint python -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable \
              project/benchmark_buy_hold.py \
              --start "$start" --end "$end" --fee 0.012 \
              --output "project/results/benchmark_window_${offset}/buy_hold.json"
          done
      - name: Save research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-strategy-comparison
          path: project/results/
          if-no-files-found: warn
