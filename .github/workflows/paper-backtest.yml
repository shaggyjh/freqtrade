name: Paper-only Freqtrade backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project/**'
      - '.github/workflows/paper-backtest.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download candles and run backtest
        run: |
          mkdir -p project/results
          docker run --rm -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable             download-data --config project/config.paper.json --timeframes 1h --days 365
          docker run --rm -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable             backtesting --config project/config.paper.json --strategy-path project/strategies             --strategy SimpleTrend --export trades --export-filename project/results/baseline.json             | tee project/results/backtest.log
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freqtrade-backtest-results
          path: project/results/
          if-no-files-found: warn
